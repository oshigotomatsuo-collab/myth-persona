<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神話キャラクター診断 ── MYTH PERSONA</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@300;400;700&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9615846999689534"
     crossorigin="anonymous"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#c9a227;--gold-l:#f0d060;--gold-d:rgba(201,162,39,.22);
  --bg:#080714;--bg-mid:#110e2a;--bg-card:rgba(16,12,38,.93);
  --silver:#c0b8d8;--text:#e8e0f5;--text-dim:#9088b0;
}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#1a1535 0%,var(--bg) 70%);color:var(--text);font-family:'Noto Serif JP',serif;overflow-x:hidden}
#starCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1;display:none;min-height:100vh}
.screen.active{display:flex}
.container{width:100%;max-width:740px;margin:0 auto;padding:30px 20px 60px}

/* ── Title ── */
#titleScreen{align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:48px 20px}
.ornament{color:var(--gold);font-size:1.2rem;letter-spacing:.5em;margin-bottom:16px;animation:gpulse 3s ease-in-out infinite}
@keyframes gpulse{0%,100%{text-shadow:0 0 8px rgba(201,162,39,.4)}50%{text-shadow:0 0 24px rgba(201,162,39,.9),0 0 50px rgba(201,162,39,.3)}}
.main-title{font-family:'Cinzel',serif;font-size:clamp(2rem,7vw,3.8rem);font-weight:700;color:var(--gold-l);text-shadow:0 0 30px rgba(201,162,39,.6);letter-spacing:.15em;margin-bottom:6px}
.subtitle{font-size:clamp(.8rem,2.5vw,1.05rem);color:var(--silver);letter-spacing:.35em;margin-bottom:32px}
.myth-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin-bottom:36px}
.mbadge{display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(255,255,255,.03);border:1px solid var(--gold-d);border-radius:10px;padding:10px 14px;transition:all .3s;cursor:default}
.mbadge:hover{background:rgba(201,162,39,.07);border-color:rgba(201,162,39,.5);transform:translateY(-2px)}
.mbadge .mi{font-size:1.5rem}
.mbadge .ml{font-size:.62rem;letter-spacing:.2em;color:var(--gold)}
.lead{max-width:460px;line-height:2;color:var(--text-dim);font-size:.92rem;margin-bottom:42px}
.btn-start{position:relative;background:linear-gradient(135deg,var(--bg-mid),#2d2660);border:2px solid var(--gold);color:var(--gold-l);padding:15px 52px;font-size:1rem;font-family:'Noto Serif JP',serif;font-weight:700;cursor:pointer;letter-spacing:.25em;clip-path:polygon(13px 0%,calc(100% - 13px) 0%,100% 50%,calc(100% - 13px) 100%,13px 100%,0% 50%);overflow:hidden;transition:all .3s}
.btn-start::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(201,162,39,.25),transparent);transition:left .5s}
.btn-start:hover::after{left:100%}
.btn-start:hover{background:linear-gradient(135deg,#2d2660,#3d3690);box-shadow:0 0 35px rgba(201,162,39,.45);transform:translateY(-2px)}

/* ── Progress ── */
.progress-wrap{margin-bottom:26px}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:7px;font-size:.78rem;color:var(--gold);letter-spacing:.1em}
.progress-track{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(201,162,39,.5)}

/* ── Question Card ── */
.q-card{background:var(--bg-card);border:1px solid var(--gold-d);border-radius:20px;padding:38px 34px;backdrop-filter:blur(12px);box-shadow:0 12px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(201,162,39,.07);position:relative;animation:slideUp .45s cubic-bezier(.4,0,.2,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.35em;color:var(--gold);margin-bottom:12px}
.q-text{font-size:clamp(1rem,3vw,1.28rem);line-height:1.85;color:var(--text);margin-bottom:30px}
.answers{display:flex;flex-direction:column;gap:10px}
.ans-btn{background:rgba(255,255,255,.025);border:1px solid rgba(201,162,39,.17);border-radius:11px;padding:14px 17px;color:var(--text);font-family:'Noto Serif JP',serif;font-size:.9rem;cursor:pointer;text-align:left;line-height:1.6;position:relative;overflow:hidden;transition:all .25s}
.ans-btn .al{font-family:'Cinzel',serif;font-size:.75rem;color:var(--gold);font-weight:700;margin-right:9px}
.ans-btn::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(180deg,var(--gold),var(--gold-l));transform:scaleY(0);transform-origin:bottom;transition:transform .25s}
.ans-btn:hover{background:rgba(201,162,39,.09);border-color:rgba(201,162,39,.5);transform:translateX(4px);box-shadow:0 4px 18px rgba(201,162,39,.14)}
.ans-btn:hover::before,.ans-btn.selected::before{transform:scaleY(1)}
.ans-btn.selected{background:rgba(201,162,39,.13);border-color:var(--gold);pointer-events:none}
.corner{position:absolute;width:18px;height:18px;opacity:.3;border-color:var(--gold);border-style:solid}
.corner.tl{top:13px;left:13px;border-width:1px 0 0 1px}
.corner.tr{top:13px;right:13px;border-width:1px 1px 0 0}
.corner.bl{bottom:13px;left:13px;border-width:0 0 1px 1px}
.corner.br{bottom:13px;right:13px;border-width:0 1px 1px 0}

/* ── Loading ── */
#loadingOverlay{display:none;position:fixed;inset:0;background:rgba(8,7,20,.93);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:20px}
#loadingOverlay.on{display:flex}
.spinner{width:54px;height:54px;border:3px solid rgba(201,162,39,.15);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{color:var(--gold);letter-spacing:.2em;font-size:.85rem;animation:fblink 1.5s ease-in-out infinite}
@keyframes fblink{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Result ── */
#resultScreen{flex-direction:column}
.result-eyebrow{text-align:center;font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.4em;color:var(--gold);margin-bottom:20px}
.result-card{background:var(--bg-card);border:1px solid rgba(201,162,39,.36);border-radius:22px;padding:46px 36px;text-align:center;position:relative;overflow:hidden;margin-bottom:26px;box-shadow:0 20px 70px rgba(0,0,0,.65),0 0 45px rgba(201,162,39,.06);animation:slideUp .5s ease}
.result-card::before{content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;background:radial-gradient(ellipse at center,rgba(201,162,39,.04) 0%,transparent 65%);animation:bgp 5s ease-in-out infinite}
@keyframes bgp{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.res-myth{font-size:.75rem;letter-spacing:.3em;color:var(--gold);position:relative;z-index:1;margin-bottom:14px}
.res-emoji{font-size:4.2rem;display:block;position:relative;z-index:1;margin:6px 0 16px;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.res-name{font-family:'Cinzel',serif;font-size:clamp(1.8rem,6vw,3.5rem);font-weight:700;color:var(--gold-l);text-shadow:0 0 28px rgba(201,162,39,.65);position:relative;z-index:1;line-height:1.1}
.res-name-jp{font-size:clamp(.9rem,2.5vw,1.15rem);color:var(--silver);margin:5px 0 14px;position:relative;z-index:1;letter-spacing:.12em}
.res-title-badge{display:inline-block;border:1px solid rgba(201,162,39,.4);border-radius:20px;padding:4px 20px;font-size:.85rem;color:var(--gold);position:relative;z-index:1;margin-bottom:22px}
.res-divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 22px;position:relative;z-index:1}
.res-desc{line-height:2;color:#c0b8d8;font-size:.91rem;max-width:500px;margin:0 auto 26px;position:relative;z-index:1}
.res-traits{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;position:relative;z-index:1}
.res-episode-wrap{margin-top:22px;padding:16px 20px;background:rgba(201,162,39,.06);border:1px solid rgba(201,162,39,.2);border-radius:10px;text-align:center}
.res-episode-label{font-size:.7rem;letter-spacing:.18em;color:var(--gold-d);margin-bottom:10px}
.res-episode{font-size:.88rem;line-height:1.9;color:var(--text-dim);margin:0;text-align:left}
/* ── Rarity + Compat ── */
.res-stats{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.res-rarity,.res-compat{flex:1;min-width:140px;padding:14px 16px;border-radius:12px;text-align:center;border:1px solid rgba(201,162,39,.22);background:rgba(201,162,39,.05)}
.stat-label{font-size:.65rem;letter-spacing:.2em;color:var(--gold-d);margin-bottom:6px}
.rarity-pct{font-family:'Cinzel',serif;font-size:1.6rem;color:var(--gold-l);text-shadow:0 0 14px rgba(201,162,39,.5);font-weight:700}
.rarity-sub{font-size:.7rem;color:var(--text-dim);margin-top:2px}
.compat-card{display:flex;align-items:center;gap:10px;margin-top:4px}
.compat-emoji{font-size:1.6rem}
.compat-info{text-align:left}
.compat-name{font-size:.85rem;color:var(--gold-l);font-weight:700}
.compat-jp{font-size:.72rem;color:var(--text-dim)}
.trait{background:rgba(201,162,39,.09);border:1px solid rgba(201,162,39,.27);color:var(--gold-l);padding:4px 14px;border-radius:20px;font-size:.8rem}
/* ── Result Image ── */
.res-img-frame{width:190px;height:190px;margin:0 auto 18px;position:relative;z-index:1;flex-shrink:0}
.res-img-ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 24px rgba(201,162,39,.45),inset 0 0 24px rgba(201,162,39,.08);animation:gpulse 3s ease-in-out infinite;pointer-events:none;z-index:2}
.res-img-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:rgba(201,162,39,.06);position:relative}
.res-img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;opacity:0;transition:opacity .7s ease;position:absolute;inset:0}
.res-img.loaded{opacity:1}
.res-shimmer{position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,rgba(201,162,39,.04) 25%,rgba(201,162,39,.16) 50%,rgba(201,162,39,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.res-emoji-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:4rem;animation:float 3.5s ease-in-out infinite}
.res-emoji-badge{position:absolute;bottom:2px;right:2px;width:46px;height:46px;background:var(--bg-card);border:2px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;z-index:3;box-shadow:0 0 10px rgba(201,162,39,.3)}
.res-img-caption{font-size:.68rem;color:var(--text-dim);letter-spacing:.08em;margin-top:8px;position:relative;z-index:1}
/* ── API Key Modal ── */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(8,7,20,.9);z-index:400;align-items:center;justify-content:center;padding:20px}
.modal-ov.on{display:flex}
.modal-box{background:var(--bg-card);border:1px solid var(--gold-d);border-radius:20px;padding:34px 30px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal-ttl{font-family:'Cinzel',serif;color:var(--gold-l);font-size:1.05rem;margin-bottom:10px}
.modal-desc{color:var(--text-dim);font-size:.83rem;line-height:1.9;margin-bottom:18px}
.modal-desc a{color:var(--gold);text-decoration:none}.modal-desc a:hover{text-decoration:underline}
.key-inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--gold-d);border-radius:10px;padding:11px 14px;color:var(--text);font-family:monospace;font-size:.85rem;outline:none;margin-bottom:14px;transition:border-color .2s}
.key-inp:focus{border-color:var(--gold)}.key-inp::placeholder{color:var(--text-dim)}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-msave{background:linear-gradient(135deg,var(--bg-mid),#2d2660);border:1px solid var(--gold);color:var(--gold-l);padding:8px 22px;border-radius:20px;font-family:'Noto Serif JP',serif;font-size:.86rem;cursor:pointer;transition:all .25s}
.btn-msave:hover{box-shadow:0 0 18px rgba(201,162,39,.35);background:linear-gradient(135deg,#2d2660,#3d3690)}
.btn-mcancel{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--text-dim);padding:8px 18px;border-radius:20px;font-family:'Noto Serif JP',serif;font-size:.86rem;cursor:pointer;transition:all .25s}
.btn-mcancel:hover{border-color:rgba(255,255,255,.4);color:var(--text)}
/* ── API setup bar ── */
.api-bar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.api-bar-label{font-size:.75rem;color:var(--text-dim);letter-spacing:.1em}
.btn-apikey{background:rgba(201,162,39,.1);border:1px solid var(--gold-d);color:var(--gold);padding:5px 14px;border-radius:20px;font-size:.75rem;cursor:pointer;transition:all .25s;font-family:'Noto Serif JP',serif}
.btn-apikey:hover{background:rgba(201,162,39,.2);border-color:var(--gold)}
.api-status{font-size:.72rem;padding:3px 10px;border-radius:10px}
.api-status.set{background:rgba(6,199,85,.12);color:#06c755;border:1px solid rgba(6,199,85,.3)}
.api-status.unset{background:rgba(201,162,39,.08);color:var(--gold);border:1px solid var(--gold-d)}
.share-block{text-align:center;margin-bottom:18px}
.share-label{font-size:.75rem;letter-spacing:.3em;color:var(--gold);margin-bottom:13px}
.share-row{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
.btn-share{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:30px;border:none;cursor:pointer;font-family:'Noto Serif JP',serif;font-size:.86rem;font-weight:700;transition:all .25s}
.btn-share.tw{background:#1d9bf0;color:#fff}
.btn-share.tw:hover{background:#0d8de0;transform:translateY(-2px);box-shadow:0 6px 20px rgba(29,155,240,.38)}
.btn-share.ln{background:#06c755;color:#fff}
.btn-share.ln:hover{background:#05b04b;transform:translateY(-2px);box-shadow:0 6px 20px rgba(6,199,85,.38)}
.btn-share.cp{background:rgba(201,162,39,.12);color:var(--gold-l);border:1px solid var(--gold-d)}
.btn-share.cp:hover{background:rgba(201,162,39,.22);transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,162,39,.25)}
.btn-retry{display:block;margin:0 auto;background:transparent;border:1px solid rgba(255,255,255,.17);color:var(--text-dim);padding:10px 30px;border-radius:30px;font-family:'Noto Serif JP',serif;font-size:.86rem;cursor:pointer;transition:all .25s}
.btn-retry:hover{border-color:rgba(255,255,255,.45);color:var(--text)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(16,12,38,.97);border:1px solid var(--gold);color:var(--gold-l);padding:10px 24px;border-radius:30px;font-size:.86rem;z-index:200;transition:transform .3s cubic-bezier(.4,0,.2,1);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:560px){.q-card{padding:24px 16px}.result-card{padding:32px 16px}.myth-grid{gap:7px}.mbadge{padding:8px 10px}}
</style>
</head>
<body>
<canvas id="starCanvas"></canvas>
<div id="loadingOverlay"><div class="spinner"></div><div class="loading-msg">神々の神託を読み解いています…</div></div>
<div class="toast" id="toast"></div>


<!-- Title -->
<div class="screen active" id="titleScreen">
  <div class="container" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding-top:50px;padding-bottom:50px">
    <div class="ornament">✦ &nbsp; ✦ &nbsp; ✦</div>
    <h1 class="main-title">MYTH PERSONA</h1>
    <p class="subtitle">神話キャラクター診断 ── 100体</p>
    <div class="myth-grid">
      <div class="mbadge"><span class="mi">⚡</span><span class="ml">GREEK</span></div>
      <div class="mbadge"><span class="mi">🌿</span><span class="ml">NORSE</span></div>
      <div class="mbadge"><span class="mi">🌸</span><span class="ml">JAPAN</span></div>
      <div class="mbadge"><span class="mi">🕉️</span><span class="ml">INDIA</span></div>
      <div class="mbadge"><span class="mi">🍀</span><span class="ml">CELTIC</span></div>
      <div class="mbadge"><span class="mi">☥</span><span class="ml">EGYPT</span></div>
      <div class="mbadge"><span class="mi">🐉</span><span class="ml">CHINA</span></div>
      <div class="mbadge"><span class="mi">🏺</span><span class="ml">MESO</span></div>
      <div class="mbadge"><span class="mi">🌺</span><span class="ml">AZTEC</span></div>
    </div>
    <p class="lead">9つの神話・100体のキャラクターから、あなたの魂に宿る神話的本質を診断します。<br>10の問いに答えて、運命の神を見つけよう。</p>
    <button class="btn-start" onclick="startQuiz()">診断を始める</button>
  </div>
</div>

<!-- Quiz -->
<div class="screen" id="quizScreen" style="flex-direction:column">
  <div class="container">
    <div class="progress-wrap">
      <div class="progress-meta"><span id="qCounter">質問 1 / 10</span><span id="qPercent">0%</span></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>
    <div class="q-card" id="qCard">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="q-num" id="qNum">QUESTION 01</div>
      <div class="q-text" id="qText"></div>
      <div class="answers" id="answers"></div>
    </div>
  </div>
</div>

<!-- Result -->
<div class="screen" id="resultScreen">
  <div class="container">
    <div class="result-eyebrow">✦ &nbsp; あなたの神話的本質 &nbsp; ✦</div>
    <div class="result-card">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
      <div class="res-myth" id="resMytho"></div>
      <div class="res-img-frame">
        <div class="res-img-ring"></div>
        <div class="res-img-inner">
          <div class="res-shimmer" id="resShimmer"></div>
          <img class="res-img" id="resImg" alt="">
          <div class="res-emoji-fallback" id="resEmojiFallback"></div>
        </div>
        <div class="res-emoji-badge" id="resEmoji"></div>
      </div>
      <div class="res-img-caption" id="resImgCaption"></div>
      <div class="res-name" id="resName"></div>
      <div class="res-name-jp" id="resNameJp"></div>
      <div class="res-title-badge" id="resTitle"></div>
      <div class="res-divider"></div>
      <p class="res-desc" id="resDesc"></p>
      <div class="res-traits" id="resTraits"></div>
      <div class="res-stats">
        <div class="res-rarity">
          <div class="stat-label">✦ 出現率</div>
          <div class="rarity-pct" id="resRarity"></div>
          <div class="rarity-sub" id="resRaritySub"></div>
        </div>
        <div class="res-compat">
          <div class="stat-label">✦ 相性の良い神</div>
          <div class="compat-card">
            <div class="compat-emoji" id="compatEmoji"></div>
            <div class="compat-info">
              <div class="compat-name" id="compatName"></div>
              <div class="compat-jp" id="compatJp"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="res-episode-wrap">
        <div class="res-episode-label">✦ 神話のエピソード ✦</div>
        <p class="res-episode" id="resEpisode"></p>
      </div>
    </div>

    <div class="share-block">
      <p class="share-label">✦ &nbsp; 結果をシェアする &nbsp; ✦</p>
      <div class="share-row">
        <button class="btn-share tw" onclick="shareTw()">𝕏 Twitter</button>
        <button class="btn-share ln" onclick="shareLn()">💬 LINE</button>
        <button class="btn-share cp" onclick="copyRes()">📋 コピー</button>
      </div>
    </div>
    <button class="btn-retry" onclick="restartQuiz()">もう一度診断する</button>
  </div>
</div>

<script>
// ── Traits: pow wis cre pas mys har cou fre tri nat jus tra ──
const TR = ['pow','wis','cre','pas','mys','har','cou','fre','tri','nat','jus','tra'];

// ── State ──
let qIndex=0, userTraits={}, result=null;

function resetTraits(){TR.forEach(t=>{userTraits[t]=0})}

// ── Stars ──
(function(){
  const cvs=document.getElementById('starCanvas'),ctx=cvs.getContext('2d');
  let W,H;
  const S=Array.from({length:240},()=>({x:0,y:0,r:0,spd:0,ph:0}));
  function resize(){
    W=cvs.width=innerWidth; H=cvs.height=innerHeight;
    S.forEach(s=>{s.x=Math.random()*W;s.y=Math.random()*H;s.r=Math.random()*1.4+.3;s.spd=Math.random()*.015+.004;s.ph=Math.random()*Math.PI*2});
  }
  function draw(t){
    ctx.clearRect(0,0,W,H);
    S.forEach(s=>{
      const a=(Math.sin(t*s.spd+s.ph)+1)/2;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(220,215,255,${a*.85+.05})`;ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  resize(); addEventListener('resize',resize); requestAnimationFrame(draw);
})();

// ── Screen helpers ──
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  scrollTo({top:0,behavior:'smooth'});
}

// ── Quiz ──
function startQuiz(){
  resetTraits(); qIndex=0;
  show('quizScreen'); render();
}

function render(){
  const q=QUESTIONS[qIndex], pct=Math.round(qIndex/QUESTIONS.length*100);
  document.getElementById('qCounter').textContent=`質問 ${qIndex+1} / ${QUESTIONS.length}`;
  document.getElementById('qPercent').textContent=`${pct}%`;
  document.getElementById('progressBar').style.width=`${pct}%`;
  document.getElementById('qNum').textContent=`QUESTION ${String(qIndex+1).padStart(2,'0')}`;
  document.getElementById('qText').textContent=q.text;
  const wrap=document.getElementById('answers');
  wrap.innerHTML='';
  ['A','B','C','D'].forEach((lbl,i)=>{
    const b=document.createElement('button');
    b.className='ans-btn';
    b.innerHTML=`<span class="al">${lbl}.</span>${q.answers[i].text}`;
    b.onclick=()=>pick(q.answers[i].s,b);
    wrap.appendChild(b);
  });
  const card=document.getElementById('qCard');
  card.style.animation='none'; void card.offsetHeight; card.style.animation='';
}

function pick(s,btn){
  document.querySelectorAll('.ans-btn').forEach(b=>b.style.pointerEvents='none');
  btn.classList.add('selected');
  Object.entries(s).forEach(([t,v])=>{userTraits[t]=(userTraits[t]||0)+v});
  setTimeout(()=>{
    qIndex++;
    if(qIndex<QUESTIONS.length){render()}else{calcResult()}
  },540);
}

// ── Result ──
function calcResult(){
  show('quizScreen');
  const ol=document.getElementById('loadingOverlay');
  ol.classList.add('on');
  setTimeout(()=>{
    ol.classList.remove('on');
    // find best match by dot product
    let best=null, bestScore=-Infinity;
    CHARS.forEach(c=>{
      let score=0;
      TR.forEach(t=>{score+=(userTraits[t]||0)*(c.p[t]||0)});
      if(score>bestScore){bestScore=score;best=c}
    });
    result=best;
    renderResult();
    show('resultScreen');
  },2400);
}

'Inari':'五穀豊穣・商売繁盛・縁結びを司り、狐を使者とする。全国に約3万社という最多の神社数を誇る。稲荷山に降臨した白い狐が稲を持っていたことから「稲荷」の名が生まれたとも言われる。',
'Benzaiten':'江ノ島の五頭龍伝説では、人々を苦しめていた龍を改心させて夫とした。琵琶を奏でる姿が美しく、音楽・芸術・弁才の守護神として七福神で唯一の女神として広く崇拝される。',
'Ebisu':'元は「蛭子（ひるこ）」として生まれ、三歳になっても足が立たなかったため海に流された。海を渡り人々に拾われ恵比寿として祀られるようになった。釣り竿と鯛を持つ朗らかな姿が象徴的。',
'Brahma':'宇宙の始まりに「オーム」を唱え、蓮の花（ロータス）の上から現れて世界を創造した。四つの顔を持ちヴェーダを生み出し人類に知識をもたらした。しかし娘への不適切な執着が神格を低下させた。',
'Vishnu':'大洪水の危機に魚（マツヤ）の姿で現れ、人類の祖マヌを洪水から救った。地上に危機が訪れるたびにラーマや Krishna など10の姿（ダシャーヴァターラ）で降臨し正義を守り続ける。',
'Shiva':'ガンジス川が天から降る際、その勢いで大地が壊れないよう自らの頭で受け止めた。また神々と悪魔が不死の甘露を得るため海を攪拌した際に生まれた猛毒を一人で飲み干し、喉が青くなった。',
'Lakshmi':'乳海攪拌の際に白い蓮の花の上に立って海から生まれ、ヴィシュヌの妃となった。彼女が訪れる場所には繁栄がもたらされ、去る場所には衰退が訪れると言われ、ディワリ祭では特に崇拝される。',
'Saraswati':'ブラフマーが自らの知識から生み出した女神で、言語・音楽・学問・芸術の守護神となった。白い蓮の花に座り琵琶を奏でる姿は純粋な知性の象徴。人類に言語とヴェーダの知識を授けた。',
'Durga':'神々でも倒せなかった水牛の魔王マヒシャスラを一人で戦い勝利した。全ての神々の力と武器が集結して誕生した無敵の女神で、9日間の戦いの末に悪を完全に打ち倒した。',
'Kali':'ドゥルガーの額から生まれた恐ろしい姿の女神。悪神ラクタヴィージャは血が地に落ちるたびに新たな悪が生まれたが、カーリーはその血ごと全て飲み干して問題を解決した。しかし戦いに興奮し世界を踏み荒らした。',
'Ganesha':'シヴァが帰宅したとき、門番をしていた少年（自分の子）の存在を知らず首を切り落とした。後悔したシヴァが最初に出会った動物（象）の頭を付け替えたことで、象の頭を持つ神が誕生した。',
'Krishna':'クルクシェートラの戦場でアルジュナが戦意を失ったとき、「魂は不滅であり、義務を果たすことが最高の善」と「バガヴァッド・ギーター」の教えを説いた。笛を奏でて牛飼いの少女たちを魅了した逸話も有名。',
'Hanuman':'ラーマの妻シータを救うためインド洋を飛び越えてスリランカへ渡り、一人でラーヴァナの軍勢と戦い続けた。仲間が傷ついたとき薬草の生える山を丸ごと運んで救い、絶対の忠誠と友情を示した。',
'Indra':'雨龍ヴリトラが水を独占して世界を干ばつにしたとき、雷霆ヴァジュラでヴリトラを打ち倒し閉じ込められた水を解放した。しかし自らの傲慢さから何度も失脚し、謙虚さを学ぶ神でもある。',
'Agni':'神と人間の間を往来する聖なる火として、祭壇に捧げられた供物を神々に届ける仲介者の役割を担う。どんな闇にも光をもたらし悪霊を払い、ヴェーダの賛歌で最も多く讃えられた神でもある。',
'Varuna':'全ての人間の行動を見通す千の目を持ち、誓いを破った者を縄で縛って病と苦しみをもたらした。一方で心から謝罪した者の罪を赦す深い慈悲も持ち、宇宙の法則リタを守護する。',
'Arjuna':'クルクシェートラの戦場で敵の中に師匠や親族を見つけ武器を捨てようとしたが、クリシュナの教えで義務の意味を理解し最強の弓として戦い抜いた。インドラの息子として天界の武器も授かっている。',
'Rama':'妻シータがラーヴァナに攫われると、ハヌマーンと猿の軍勢と共にスリランカに攻め込み悪魔王を倒してシータを救出した。その生涯は「ラーマーヤナ」として語り継がれ、理想の王の手本とされる。',
'The Dagda':'魔法の棍棒の一端で生者を殺し、もう一端で死者を蘇らせることができる。また望む食料が尽きない不思議な大釜でダーナ神族を養い続けた。ケルト神話最大の戦いモイトゥーラの戦いを勝利に導いた。',
'The Morrigan':'英雄クー・フーリンに恋をして断られ、様々な動物の姿で戦場に現れて妨害した。最終的にカラスとして彼の死を予知し、その死後に肩に止まった。戦場に現れるカラスはモリガンの化身とされる。',
'Lugh':'ダーナ神族に入るため「あなたの神々にない技能を持つ者しか入れない」と言われ、詩人・鍛冶・医者・魔術師など全ての技能を持つと証明して入場を果たした。後に父の仇討ちでケルト神話最大の戦いを勝利に導く。',
'Cú Chulainn':'少年時代にクランの猛犬を素手で倒し、その償いとして自ら代わりの番犬を務めると申し出たことで「クランの猟犬」の名を得た。戦闘狂化（リャストラッド）で無双の強さを発揮した伝説の英雄。',
'Brigid':'キルデアの聖なる炎は消えることなく千年以上燃え続けたと言われる。ケルトの女神からキリスト教の聖ブリジットへと姿を変えながら、炎・詩・癒し・鍛冶の守護者として信仰が続いた。',
'Cernunnos':'冬に角を失い春に再び生やす鹿のように、生と死と再生の輪廻を体現した。ガンドストラップの大釜に刻まれた姿では蛇と角を持ち、野生動物に囲まれた生命の守護者として描かれている。',
'Nuada':'第一次マグ・トゥレドの戦いで右手を失い王座を追われた。後に医神ディアン・ケヒトが銀の義肢を与え王座に返り咲いたが、第二次の戦いでは戦死しながらも最後まで王の誇りを保ち続けた。',
'Bran':'不思議な銀の枝を受け取り海の向こうの「永遠の若さの国（ティル・ナ・ノーグ）」への航海に旅立った。帰還後は現実の時間が数百年過ぎており、地に足をつけた瞬間に老人となったという。',
'Danu':'ダーナ神族の母なる女神。川と水の源泉を体現し、アイルランドの大地そのものとして崇められた。神族が地下に退いた後は妖精（シー）の女王として今もアイルランドの大地に宿るとされる。',
'Arawn':'生者の王プウィルに1年間の身分交換を提案し、その間プウィルが誠実に行動したことを喜び、長年の友として深い絆を結んだ。死の国アンヌンを厳格かつ公正に統治する冥界の王。',
'Ra':'毎夜太陽の船で空を渡り、冥界を通過する際に邪神アポフィスと壮絶な戦いを繰り広げ、夜明けに再び東の地平線から昇る。この永遠の戦いが太陽の運行を支えていると信じられた。',
'Osiris':'弟セトに木箱に閉じ込められナイル川に流された後、妻イシスが体を集めて蘇らせた。しかし完全な蘇生が叶わず冥界の王として死者を裁く役割を担い、復活の神として崇拝されるようになった。',
'Isis':'バラバラにされた夫オシリスの体を探し集め、魔術で息子ホルスを孕んだ。ホルスを隠れ育て最終的に王座に就けた。世界で最も強力な魔術を持つ女神として、生命と再生の象徴となった。',
'Horus':'父の仇セトと長年戦い続けた。その戦いで左目を失ったが、智慧の神トトの魔術で回復した。この目は「ウジャトの目」として守護のシンボルとなり、現在もお守りとして世界中で使われている。',
'Seth':'オシリスを木箱に閉じ込めナイルに流し、帰還後は切り刻んで各地に散らばせた。しかし太陽船ラーを外部の敵から守る役割も担い、混沌と秩序の両方に必要な神として複雑な立場を持つ。',
'Anubis':'死者の心臓をマアトの羽根と天秤にかけ、心臓の方が重ければ怪物アンムットに食べさせ、軽ければ楽園（アアル）へ案内した。この「死者の審判」はエジプト人の死生観の核心をなす。',
'Thoth':'ホルスとセトの争いを調停し神聖な法と裁きを記録した。また太陰暦を計算して神々に30日分の日数を追加し、ヌトが禁じられていた日以外の日に子供を産めるよう手配した。',
'Bastet':'もとはライオンの戦士女神だったが、太陽神ラーの目として猫の姿に変わり家庭の守護者となった。古代エジプトでは猫を傷つけた者は死刑という厳格な法律があり、猫の神聖さを物語る。',
'Hathor':'ラーが人類の謀反を恐れ復讐として解き放ったが、人類を愛するラーが思い直してビールを血の色に染め飲ませて酔わせた。目覚めた際には怒りが消えており、愛と喜びの女神に戻った。',
'Sekhmet':'ラーの命で人類への復讐に出た際、血の味に夢中になって止まらなくなった。神々がビールを赤く染めて飲ませて眠らせることでようやく止まったという。その疫病の力は医術の力にも転化した。',
'Ptah':'「言葉」と「思考」だけで世界を創造した。神々のそれぞれの姿や役割も、プタハが言葉で呼んだことによって生まれたと信じられ、職人・鍛冶・芸術家の最高守護神として崇拝された。',
'Nephthys':'甥ホルスの誕生と成長を陰ながら支え、兄オシリスの魂が安らかに冥界へ渡れるよう姉イシスと共に哀悼の歌を捧げた。その神秘的な力は死者に平和をもたらし、冥界の秘密の守護者とされた。',
'Nut':'毎夜夫ゲブと接吻しようとするが大気の神シュウが二人を引き離し続ける。体に宿した星々が夜空となり、毎朝太陽（ラー）を口から産み出す。星座の母として宇宙そのものを体現した存在。',
'Geb':'大地の神として、笑い声が地震を引き起こすとも言われる。妻ヌトが体を弓なりにそらして天を形成し、その下に広がるゲブの体が大地となった。大地の肥沃さと生命力そのものを体現する。',
'Maat':'宇宙が混沌から生まれた時から存在し、ファラオはマアトの原則（真実・秩序・公正）を守ることで統治権を得るとされた。死者の審判では心臓をマアトの羽根と比べ、魂の行方を決定する最高基準となる。',
'Guanyin':'千の手と千の目を持つ形に変化し、全ての方向からの苦しみを同時に救えるようになったという。かつては男性の姿だったが、中国では徐々に慈悲深い母の姿へと変化し「千手観音」として広く崇拝される。',
'Sun Wukong':'天界の不老不死の桃を盗み食いし、太上老君の丹薬も食べ、閻魔大王の帳簿から自分の名を消すなど天界全体を大混乱に陥れた。最終的に釈迦如来に手のひらから出られないことを証明され、五行山に封印された。',
'Nezha':'海龍王の息子を倒したことで父に迷惑をかけまいと自ら命を絶ったが、師匠の法術によって蓮の花から新たな体を得て復活した。炎の輪（風火輪）と宇宙の布（乾坤圈）を操る若き戦神として天界を守る。',
'Nuwa':'天地の間に穴が開き大洪水が起きたとき、五色の石を溶かして天を修復し、大亀の足を切り取って天の四隅を支えた。また孤独だった人間たちのために泥から人間を形作り、命を吹き込んだ。',
'Fuxi':'蜘蛛が巣を張る様子を観察して網・罠の作り方を発明し人々に漁と狩りを教えた。龍の体と人間の頭を持ち、八卦を発明して中国哲学の基礎を作った文明の始祖神。妹女媧とともに人類の父母とされる。',
"Chang'e":'夫后羿が手に入れた不老不死の薬を独り飲んで月に昇った。月宮殿で玉兎と共に孤独に暮らしながら、今も地上の人々を見守り続けている。中秋節に月を眺める習慣はこの伝説から生まれた。',
'Hou Yi':'十の太陽が同時に昇り大地が焼き尽くされたとき、帝堯の命を受け九つの太陽を弓で射落とした。残した一つの太陽が今日の太陽となった。妻嫦娥に不死の薬を渡したが飲まれてしまった悲劇の英雄。',
'Zhu Rong':'水神共工と壮絶な戦いを繰り広げた。敗れた共工が怒りのあまり天を支える柱「不周山」に頭突きをして壊し、天地が傾く大災害を引き起こした。この出来事がきっかけで女媧が天を修復することになった。',
'Guan Yu':'三国志の武将として曹操の捕虜になりながらも義兄劉備への忠義を貫き、消息を知るや厚遇を断って単身帰参した。死後は義と武の神として神格化され、商売繁盛から警察まで幅広く信仰される。',
'Zhong Kui':'科挙に合格しながら容貌が醜いとして落とされた怒りで自ら命を絶ったが、皇帝から死後に鬼神退治の神として封じられた。鬼を捕らえ食べる守護神として、今も魔除けの絵として家に飾られる。',
'Erlang Shen':'孫悟空と72変化の化け比べ対決を繰り広げ、最終的に太上老君の金剛圈で孫悟空を捕えた。三つ目から発する神光はあらゆる欺瞞を見通し、天界最強の武神として隠れた実力者の象徴とされる。',
'Long Wang':'雨を降らせる権限を持つが玉皇大帝の許可なしには動けない。孫悟空に如意棒を奪われても手が出せなかった竜王だが、海底の宮殿から四海を支配し、水に関するすべての事象を管理する。',
'Xi Wangmu':'3000年に一度実る不死の桃の宴を主催する仙女王。孫悟空が桃を盗んで宴を台無しにした際も、宇宙の法則を超えた老女神の威厳で対処した。西方の崑崙山に住み不老不死の薬を管理する。',
'Mazu':'嵐の海で溺れかけた父と兄弟を救おうとしたが力尽き昇天した少女の霊が女神となった。今も海に出た人々を守護するため嵐の中を飛ぶと伝えられ、東南アジアの漁師たちに最も信仰される海の女神。',
'Caishen':'趙公明という武将が道術を修めて財神となったという説が有名。春節には各家庭を回って福をもたらし、商売人たちが最初に拝む神として中国の商業文化の象徴的存在となっている。',
'Marduk':'原初の海ティアマトを真っ二つに割り、上半分を天・下半分を大地として世界を創造した。さらに神々の血から人類を造り、神々を労働から解放した。バビロン最高神として50の名前を持つ。',
'Ishtar':'愛する牧羊神タンムズを死の国に落とし、後悔して冥界の女王エレシュキガルに会いに行った。7つの門を通るたびに装飾品を剥ぎ取られ裸で冥界に降り立った。この話は死と再生の象徴として語られる。',
'Gilgamesh':'親友エンキドゥの死を経験し不死を求めて旅立った。海底の不死の草を手に入れながら蛇に盗まれてしまい、「真の不滅は名声と遺業にこそある」と悟って故郷ウルクへ帰還した。',
'Enkidu':'野生の生活をしていたところ神殿の女性と7日間過ごして文明に目覚めた。ギルガメシュとの格闘の後に親友となり、天牛フンババ退治など数々の冒険を共にした。その死がギルガメシュを変えた。',
'Enlil':'人間の騒音がうるさいと怒り、大洪水を起こして人類を滅亡させようとした。しかし水の神エアがウトナピシュティムに箱舟を造るよう教え、人類は生き延びた。聖書のノアの箱舟の原型とされる。',
'Quetzalcoatl':'トルテク文明に知恵と文明をもたらした後、ライバルのテスカトリポカに嵌められ醜態をさらして国を去った。「いつか東から帰ってくる」という予言がスペイン征服者コルテスと重なり、歴史を変えた。',
'Tezcatlipoca':'黒曜石の鏡で人の心の罪を映し出し、英雄たちを試練で試した。ケツァルコアトルをはめて国から追い出すことに成功した。光と影のバランスを保つために混沌を生み出す宇宙の均衡者。',
'Huitzilopochtli':'母が孕んだとき、姉妹（月）と兄弟（星）に殺されそうになったが、母の胎内から飛び出し「火の蛇（シウコアトル）」を武器に全員を打ち倒し、太陽として誕生した。太陽が毎朝昇るのはこの戦いの繰り返しとされる。',
'Coatlicue':'白い羽根が腹に触れて息子ウィツィロポチトリを孕んだことで姉妹と兄弟に殺されそうになった。その体は山となり大地の母神として崇められる。生と死と再生を体に宿す根源的な存在。',
'Tlaloc':'雨の恵みをもたらす農業の守護神として深く崇拝されながら、子どもを生け贄として求めたとも言われる。テノチティトランの大神殿の最上部に祀られ、太陽神と並ぶアステカ最重要の神の一柱。',
};

// ── Rarity & Compatibility ──
function getRarity(c){
  // consistent pseudo-random per character name
  let h=0;
  for(let i=0;i<c.n.length;i++) h=(h*31+c.n.charCodeAt(i))%1000;
  const pct=((h%90)+10)/10; // 1.0〜9.9%
  return Math.round(pct*10)/10;
}
function getRarityLabel(pct){
  if(pct<=2)return'✦✦✦ 超レア';
  if(pct<=4)return'✦✦ レア';
  return'✦ スタンダード';
}
function findCompatible(c){
  let best=null,bestScore=-Infinity;
  CHARS.forEach(ch=>{
    if(ch.n===c.n)return;
    let score=0;
    TR.forEach(t=>{score+=(c.p[t]||0)*(ch.p[t]||0)});
    if(score>bestScore){bestScore=score;best=ch}
  });
  return best;
}

// ── Pollinations.ai (free, no API key) ──
const MYTH_EN={
  greek:'Greek mythology',norse:'Norse mythology',japan:'Japanese Shinto mythology',
  india:'Hindu mythology',celtic:'Celtic mythology',egypt:'Ancient Egyptian mythology',
  china:'Chinese mythology',meso:'Ancient Mesopotamian mythology',aztec:'Aztec mythology'
};

function pollinationsUrl(c){
  const prompt=`fantasy portrait of ${c.n}, the ${c.t} from ${MYTH_EN[c.m]}, ${c.tr.join(', ')}, epic divine atmosphere, dark cosmic background, dramatic lighting, digital painting, no text`;
  return`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&model=flux&nologo=true&seed=${c.n.length*37}`;
}

async function renderResult(){
  const c=result;
  document.getElementById('resMytho').textContent=MYTH[c.m].label;
  document.getElementById('resEmoji').textContent=c.e;
  document.getElementById('resName').textContent=c.n;
  document.getElementById('resNameJp').textContent=c.jp;
  document.getElementById('resTitle').textContent=c.t;
  document.getElementById('resDesc').textContent=c.d;
  document.getElementById('resTraits').innerHTML=c.tr.map(t=>`<span class="trait">${t}</span>`).join('');
  document.getElementById('resEpisode').textContent=EPISODES[c.n]||'';
  const pct=getRarity(c);
  document.getElementById('resRarity').textContent=pct+'%';
  document.getElementById('resRaritySub').textContent=getRarityLabel(pct);
  const comp=findCompatible(c);
  if(comp){
    document.getElementById('compatEmoji').textContent=comp.e;
    document.getElementById('compatName').textContent=comp.n;
    document.getElementById('compatJp').textContent=comp.jp+' ／ '+MYTH[comp.m].label.replace(/^.+ /,'');
  }

  const imgEl=document.getElementById('resImg');
  const shimmerEl=document.getElementById('resShimmer');
  const fallbackEl=document.getElementById('resEmojiFallback');
  const captionEl=document.getElementById('resImgCaption');

  imgEl.classList.remove('loaded');imgEl.src='';imgEl.style.display='none';
  fallbackEl.style.display='none';fallbackEl.textContent=c.e;
  shimmerEl.style.display='block';captionEl.textContent='✨ AIイラスト生成中…';

  imgEl.style.display='block';
  imgEl.onload=()=>{shimmerEl.style.display='none';imgEl.classList.add('loaded');captionEl.textContent=''};
  imgEl.onerror=()=>{imgEl.style.display='none';shimmerEl.style.display='none';fallbackEl.style.display='flex';captionEl.textContent=''};
  imgEl.src=pollinationsUrl(c);
}

function restartQuiz(){show('titleScreen')}

// ── Share ──
function shareText(){
  if(!result)return'';
  const pct=getRarity(result);
  const comp=findCompatible(result);
  const compatLine=comp?`\n相性の良い神：${comp.jp}（${comp.n}）`:'';
  return`🔮 神話キャラクター診断\n\n私は「${result.jp}（${result.n}）」\n${MYTH[result.m].label} ／ ${result.t}\n出現率 ${pct}%${compatLine}\n\n${result.tr.join(' ・ ')}\n\n#神話キャラクター診断 #MythPersona`;
}
function shareTw(){window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText())}`,'_blank','width=600,height=420')}
function shareLn(){window.open(`https://line.me/R/share?text=${encodeURIComponent(shareText())}`,'_blank')}
function copyRes(){
  const txt=shareText();
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('コピーしました！')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('コピーしました！');
  });
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}
